# Generated by uie-fullsend github onboard.
# Dispatches the Jira delivery controller for a selected ticket and Fullsend stage.
# Required as the GitHub Actions entry point that serializes per-ticket delivery
# and invokes the repository-local controller with the configured Jira secrets.
name: Fullsend Jira Delivery Controller

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Jira ticket key (e.g. FRFLY-123)"
        required: true
        type: string
      stage:
        description: "Delivery stage ('triage' or 'code')"
        required: false
        default: "triage"
        type: choice
        options:
          - triage
          - code
      force:
        description: "Force execution ignoring lease TTL"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: fullsend-delivery-${{ inputs.ticket || 'manual' }}
  cancel-in-progress: false

jobs:
  delivery-controller:
    name: Delivery Controller
    runs-on: ubuntu-latest
    if: github.repository == 'jasonawant/new-uie-fullsend-onboarding-test'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Jira Delivery Controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULLSEND_JIRA_API_TOKEN: ${{ secrets.JIRA_TOKEN || secrets.FULLSEND_JIRA_API_TOKEN }}
          FULLSEND_JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL || vars.JIRA_USER_EMAIL || vars.FULLSEND_JIRA_EMAIL || secrets.FULLSEND_JIRA_EMAIL }}
          FULLSEND_JIRA_URL: ${{ vars.JIRA_BASE_URL || vars.FULLSEND_JIRA_URL || 'https://redhat.atlassian.net' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TICKET_ID: ${{ inputs.ticket }}
          STAGE: ${{ inputs.stage || 'triage' }}
          FORCE_CLAIM: ${{ inputs.force || false }}
        run: |
          if [ -n "$TICKET_ID" ]; then
            python3 .fullsend/scripts/jira-delivery-controller.py \
              --ticket "$TICKET_ID" \
              --stage "$STAGE" \
              $( [ "$FORCE_CLAIM" = "true" ] && echo "--force" )
          else
            echo "Scheduled execution: checking for tickets requiring delivery..."
            python3 .fullsend/scripts/jira-delivery-controller.py --poll
          fi
