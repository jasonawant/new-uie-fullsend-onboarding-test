# Generated by uie-fullsend github onboard.
# Runs the repository's Fullsend code implementation stage for a requested Jira ticket.
# Required so approved triage work can create and update GitHub pull requests, then
# reconcile the code-stage outcome back to Jira.
name: Fullsend Code Agent

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Jira ticket key (e.g. FRFLY-123)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  code:
    name: Run Code Implementation Agent
    runs-on: ubuntu-latest
    if: github.repository == 'jasonawant/new-uie-fullsend-onboarding-test'
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run code agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET_ID: ${{ inputs.ticket }}
        run: |
          echo "Executing code implementation agent for ticket $TICKET_ID..."
          # Repository-local agent execution logic

      - name: Reconcile code stage completion
        if: always()
        env:
          FULLSEND_JIRA_API_TOKEN: ${{ secrets.JIRA_TOKEN || secrets.FULLSEND_JIRA_API_TOKEN }}
          FULLSEND_JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL || vars.JIRA_USER_EMAIL || vars.FULLSEND_JIRA_EMAIL || secrets.FULLSEND_JIRA_EMAIL }}
          FULLSEND_JIRA_URL: ${{ vars.JIRA_BASE_URL || vars.FULLSEND_JIRA_URL || 'https://redhat.atlassian.net' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TICKET_ID: ${{ inputs.ticket }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="failed"
          fi
          python3 .fullsend/scripts/jira-delivery-controller.py \
            --reconcile \
            --ticket "$TICKET_ID" \
            --stage "code" \
            --status "$STATUS"
