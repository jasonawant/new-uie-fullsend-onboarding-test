# Generated by uie-fullsend github onboard.
# See https://gitlab.cee.redhat.com/ixd-firefly/cli-tools/uie-fullsend/-/blob/main/docs/github-onboarding.md#upstream-scaffold-and-uie-jira-delivery-overlay
# Runs the repository's Fullsend triage stage for a requested Jira ticket.
# Required to assess eligible Jira work before the guarded code stage can be
# dispatched, and to reconcile the triage outcome back to Jira.
name: Fullsend Triage Agent

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Jira ticket key (e.g. FRFLY-123)"
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  triage:
    name: Run Triage Agent
    runs-on: ubuntu-latest
    if: github.repository == 'jasonawant/new-uie-fullsend-onboarding-test'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run triage assessment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET_ID: ${{ inputs.ticket }}
        run: |
          echo "Executing triage agent for ticket $TICKET_ID..."
          # Repository-local agent execution logic

      - name: Reconcile triage stage completion
        if: always()
        env:
          FULLSEND_JIRA_API_TOKEN: ${{ secrets.JIRA_TOKEN || secrets.FULLSEND_JIRA_API_TOKEN }}
          FULLSEND_JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL || vars.JIRA_USER_EMAIL || vars.FULLSEND_JIRA_EMAIL || secrets.FULLSEND_JIRA_EMAIL }}
          FULLSEND_JIRA_URL: ${{ vars.JIRA_BASE_URL || vars.FULLSEND_JIRA_URL || 'https://redhat.atlassian.net' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TICKET_ID: ${{ inputs.ticket }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="failed"
          fi
          python3 .fullsend/scripts/jira-delivery-controller.py \
            --reconcile \
            --ticket "$TICKET_ID" \
            --stage "triage" \
            --status "$STATUS"
