# Generated by uie-fullsend github onboard.
# Scheduled, repository-scoped Jira polling using the upstream Fullsend dispatcher.
name: fullsend Jira poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Least privilege: the poll job only checks out this repository.
permissions:
  contents: read

jobs:
  poll:
    # Manual runs validate the integration before scheduled polling is enabled.
    if: github.event_name == 'workflow_dispatch' || vars.FULLSEND_JIRA_POLL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: fullsend-jira-poll
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      tickets: ${{ steps.build-matrix.outputs.tickets }}
    steps:
      - uses: actions/checkout@v4

      - name: Install fullsend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.53.0 --repo fullsend-ai/fullsend \
            -p 'fullsend_*_linux_amd64.tar.gz' -O - | tar xz
          sudo mv fullsend /usr/local/bin/

      - name: Poll Jira
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          FULLSEND_JIRA_TEAM_FIELD: ${{ vars.FULLSEND_JIRA_TEAM_FIELD || 'customfield_10001' }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          fullsend poll \
            --input-driver jira-poll \
            --jira-url "${JIRA_BASE_URL}" \
            --jira-project FRFLY \
            --jql 'project = FRFLY AND labels = "repo:jasonawant/new-uie-fullsend-onboarding-test" AND statusCategory != Done ORDER BY updated DESC' \
            --target-repo "${TARGET_REPO}" \
            --output dispatches.json \
            --fullsend-dir .fullsend

      - name: Apply durable Jira attribution
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
        run: |
          set -euo pipefail
          if ! jq -e 'length > 0' dispatches.json > /dev/null 2>&1; then
            echo "No dispatches; skipping Jira attribution."
            exit 0
          fi
          if [ -z "${JIRA_TOKEN:-}" ] || [ -z "${JIRA_USER_EMAIL:-}" ] || [ -z "${JIRA_BASE_URL:-}" ]; then
            echo "Jira credentials or base URL not configured; skipping Jira attribution."
            exit 0
          fi
          AUTH=$(printf '%s:%s' "${JIRA_USER_EMAIL}" "${JIRA_TOKEN}" | base64 | tr -d '\r\n')
          BASE_URL="${JIRA_BASE_URL%/}"
          TICKETS=$(jq -r '.[] | (.event_payload._normalized_event.entity.key // .FULLSEND_TICKET // empty)' dispatches.json | grep -E '^[A-Z][A-Z0-9]+-[0-9]+$' | sort -u || true)
          # Additive REST update: PUT /rest/api/3/issue/{issue_key}
          for ticket in ${TICKETS}; do
            echo "Applying fullsend-used label to Jira issue ${ticket} (PUT /rest/api/3/issue/${ticket})..."
            curl -sS -f -X PUT "${BASE_URL}/rest/api/3/issue/${ticket}" \
              -H "Authorization: Basic ${AUTH}" \
              -H "Content-Type: application/json" \
              -d '{"update": {"labels": [{"add": "fullsend-used"}]}}'
          done

      - name: Build dispatch matrix
        id: build-matrix
        run: |
          set -euo pipefail
          if ! jq -e 'length > 0' dispatches.json > /dev/null 2>&1; then
            echo "No dispatches."
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            echo 'tickets=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MATRIX=$(jq -c '{include: .}' dispatches.json)
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s' "${MATRIX}"
            echo
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"
          TICKETS=$(jq -c '[.[] | (.event_payload._normalized_event.entity.key // .FULLSEND_TICKET // empty)] | map(strings | select(test("^[A-Z][A-Z0-9]+-[0-9]+$"))) | unique' dispatches.json)
          echo "tickets=${TICKETS}" >> "${GITHUB_OUTPUT}"

  harness:
    name: Harness
    needs: poll
    # This caller sets the maximum GITHUB_TOKEN permissions available to the
    # reusable dispatcher. Its harness-run job receives its own job-scoped token
    # and cannot elevate beyond this boundary; target-repository writes use a
    # separately minted Fullsend GitHub App token.
    #
    # GitHub Actions statically validates all nested jobs defined in a called
    # reusable workflow (`reusable-dispatch.yml`) against the calling job's
    # (`harness`) declared permissions, even if those nested jobs (like `code`
    # or `fix`) are skipped at runtime during matrix dispatch.
    permissions:
      # Required by the pinned harness-run job for its workflow operations.
      actions: write
      # Code-agent dispatches can commit changes to their working branch.
      contents: write
      # Allows the pinned harness-run job to exchange its Actions identity for WIF.
      id-token: write
      # Allows the pinned harness-run job to publish work-item status to issues.
      issues: write
      # The pinned reusable dispatcher may pull its container from GitHub Packages.
      packages: read
      # Allows the pinned harness-run job to publish work-item status to pull requests.
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@v0.53.0
    with:
      matrix: ${{ needs.poll.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      fullsend_version: v0.53.0
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

  reconcile-attribution:
    name: Reconcile durable attribution
    needs: [poll, harness]
    if: always() && needs.poll.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply durable PR attribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TICKETS: ${{ needs.poll.outputs.tickets }}
        run: |
          set -euo pipefail
          if [ -z "${TICKETS}" ] || [ "${TICKETS}" = "[]" ]; then
            echo "No tickets dispatched; skipping PR attribution."
            exit 0
          fi
          gh label create "fullsend-used" \
            --color "6699CC" \
            --description "Autonomous Fullsend agent was used on this pull request" \
            --force 2>/dev/null || true
          PRS_JSON=$(gh pr list --state all --limit 50 --json number,headRefName,title,body 2>/dev/null || echo "[]")
          for ticket in $(echo "${TICKETS}" | jq -r '.[]'); do
            echo "Checking PRs for ticket ${ticket}..."
            MATCHED_PRS=$(echo "${PRS_JSON}" | jq -r --arg t "${ticket}" '.[] | select((.headRefName // "" | test("(^|[^A-Za-z0-9])" + $t + "($|[^0-9])"; "i")) or (.title // "" | test("(^|[^A-Za-z0-9])" + $t + "($|[^0-9])"; "i")) or (.body // "" | test("(^|[^A-Za-z0-9])" + $t + "($|[^0-9])"; "i"))) | .number' | sort -u || true)
            for pr_number in ${MATCHED_PRS}; do
              echo "Applying fullsend-used label to PR #${pr_number}..."
              gh pr edit "${pr_number}" --add-label "fullsend-used"
            done
          done
