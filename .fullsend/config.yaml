# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: pi
roles:
    - triage
    - coder
    - review
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai/fullsend
            - fullsend-ai/agents
inference:
    project: firefly-868139
    wif_provider: projects/275116376890/locations/global/workloadIdentityPools/uie-github-fullsend-inference/providers/gh-repo-1438686685
agents:
    - name: triage
      model: google-vertex/gemini-3.8-flash
      source: https://raw.githubusercontent.com/fullsend-ai/agents/v0.53.0/harness/triage.yaml#sha256=f935d591305e127967c4378ab9474f50da9cbd59e5dc299eebba83241faf1718
  - name: code
    source: https://raw.githubusercontent.com/fullsend-ai/agents/v0.53.0/harness/code.yaml#sha256=0cf4e64085a181606a0f33af5250cf56d8f12d4c6b91ae7bdf9f72a28e2137eb
    model: google-vertex/gemini-3.8-flash
  - name: review
    model: google-vertex/gemini-3.8-flash
    trigger: >-
      event.transition.kind == "comment_added"
      && has(event.entity.linked_change_proposal)
      && has(event.transition.comment.command)
      && event.transition.comment.command == "/fs-review"
      && event.actor.kind == "human"
  - name: fix
    model: google-vertex/gemini-3.8-flash
  - name: retro
    enabled: false
  - name: prioritize
    enabled: false
