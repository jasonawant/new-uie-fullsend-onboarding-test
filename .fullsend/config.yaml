---
version: '1'
agents:
  - name: kb
    source: harness/kb.yaml
    description: Living Repository Knowledge Base agent with episodic memory, rule
      enforcement, and weekly reconciliation.
    role: analyst
    runtime: pi
    model: google-vertex/gemini-3.8-flash
  - name: triage
    source: harness/triage.yaml
    model: google-vertex/gemini-3.8-flash
  - name: code
    source: harness/code.yaml
    model: google-vertex/gemini-3.8-flash
  - name: review
    model: google-vertex/gemini-3.8-flash
    trigger: >-
      event.transition.kind == "comment_added"
      && has(event.entity.linked_change_proposal)
      && has(event.transition.comment.command)
      && event.transition.comment.command == "/fs-review"
      && event.actor.kind == "human"
  - name: fix
    model: google-vertex/gemini-3.8-flash
  - name: retro
    enabled: false
  - name: prioritize
    enabled: false
create_issues:
  allow_targets:
    repos:
      - ixd-firefly/cli-tools/uie-fullsend
