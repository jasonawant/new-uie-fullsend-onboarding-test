# Defines the Jira-to-GitHub delivery route, stage gates, labels, and lease rules.
# Required by the delivery controller to dispatch only eligible work and prevent
# concurrent workflows from processing the same Jira ticket.
version: 1
repository: "jasonawant/new-uie-fullsend-onboarding-test"
canonical_route: "repo:github/jasonawant/new-uie-fullsend-onboarding-test"

sprint_policy:
  optional: true

stages:
  triage:
    required_request_label: "ready-for-triage"
    output_label: "triaged"
    auto_backlog: false
  code:
    required_request_label: "ready-to-code"
    requires_triage_pass: true
    output_label: "fullsend-code-completed"

lease:
  property_key: "uie.fullsend.claim"
  ttl_minutes: 60

projections:
  in_progress_label: "fullsend-in-progress"
  dispatched_label_prefix: "fullsend"
